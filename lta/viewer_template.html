<!DOCTYPE html>
<html lang="sq"><head><meta charset="utf-8"><title>Luna Tomato Advertising – 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f5f8;--fg:#15171c;--card:#fff;--mut:#5b6270;--ac:#d9480f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--fg:#e8eaf0;--card:#171b25;--mut:#9aa3b5;--ac:#ff8a4c}}
:root[data-theme="dark"]{--bg:#0d1017;--fg:#e8eaf0;--card:#171b25;--mut:#9aa3b5;--ac:#ff8a4c}
html{height:100%}body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:14px}h1{font-size:1.25rem;margin:.2rem 0}.sub{color:var(--mut);margin:0 0 10px}
#v{position:relative;height:56vh;min-height:320px;border-radius:12px;overflow:hidden;background:#05070d}#v canvas{display:block;width:100%;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.bar button{background:var(--card);color:var(--fg);border:1px solid var(--mut);border-radius:8px;padding:6px 12px;cursor:pointer}
.bar input[type=range]{flex:1;min-width:140px}.k{display:flex;flex-wrap:wrap;gap:14px;color:var(--mut);font-size:.9rem}.k b{color:var(--fg)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
#tl{width:100%;height:110px;background:var(--card);border-radius:10px;display:block}code{font-size:.85rem;word-break:break-all}
  
</style></head><body><main>
<h1>Luna Tomato Advertising · flota në 3D</h1>
<p class="sub">Kuadri rrotullues Tokë–Hënë (CR3BP). Çdo anije kalon përpara Hënës dhe e errëson atë, kështu formohet kodi Morse.</p>
<div id="v"></div>
<div class="bar"><button id="pp">⏸ Pauzë</button><input id="sl" type="range" min="0" max="1000" value="0" aria-label="Koha">
<button id="b1">Gjithë sistemi</button><button id="b2">Zoom te Hëna</button><label>Shpejtësia <select id="sp"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="3">3×</option></select></label></div>
<canvas id="tl"></canvas>
<div class="k" id="k"></div><p class="sub"><code id="mo"></code></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const D=/*DATA*/null, COL={dro:0x38bdf8,lyap:0xfb923c,axial:0xe879f9};
const $=i=>document.getElementById(i), V=$("v");
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));V.appendChild(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(45,1,.001,50);
const mk=(r,c,x)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,32,16),new THREE.MeshBasicMaterial({color:c}));m.position.x=x;S.add(m);return m};
mk(.045,0x2f6fdb,-D.mu);const moon=mk(.022,0xcfcfcf,1-D.mu);
S.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-D.mu,0,0),new THREE.Vector3(1-D.mu,0,0)]),new THREE.LineDashedMaterial({color:0x667085})));
const sh=D.ships.map(s=>{const pts=s.p.map(q=>new THREE.Vector3(...q));
 S.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:COL[s.f],transparent:true,opacity:.55})));
 const m=new THREE.Mesh(new THREE.SphereGeometry(.012,12,8),new THREE.MeshBasicMaterial({color:0xffffff}));S.add(m);return{s,pts,m}});
let th=-1.2,ph=1.0,dist=2.6,tg=new THREE.Vector3(.5,0,0),tgT=tg.clone(),distT=dist;
function cam(){dist+=(distT-dist)*.1;tg.lerp(tgT,.1);C.position.set(tg.x+dist*Math.sin(ph)*Math.cos(th),tg.y+dist*Math.sin(ph)*Math.sin(th),tg.z+dist*Math.cos(ph));C.up.set(0,0,1);C.lookAt(tg)}
let dr=null;R.domElement.onpointerdown=e=>dr=[e.clientX,e.clientY];addEventListener("pointerup",()=>dr=null);
addEventListener("pointermove",e=>{if(!dr)return;th-=(e.clientX-dr[0])*.006;ph=Math.min(3.0,Math.max(.1,ph-(e.clientY-dr[1])*.006));dr=[e.clientX,e.clientY]});
R.domElement.onwheel=e=>{e.preventDefault();distT=Math.min(8,Math.max(.05,distT*Math.exp(e.deltaY*.001)))};
$("b1").onclick=()=>{tgT.set(.5,0,0);distT=2.6};$("b2").onclick=()=>{tgT.set(1-D.mu,0,0);distT=.25};
function size(){const w=V.clientWidth,h=V.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();const c=$("tl");c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio}
addEventListener("resize",size);size();
const mod=(a,b)=>((a%b)+b)%b;let t=0,play=true,sp=1;
$("pp").onclick=()=>{play=!play;$("pp").textContent=play?"⏸ Pauzë":"▶ Luaj"};$("sp").onchange=e=>sp=+e.target.value;$("sl").oninput=e=>t=e.target.value/1000*D.T;
const st=getComputedStyle(document.documentElement);
$("k").innerHTML=`<span>Mesazhi: <b>${D.msg}</b></span><span>Anije: <b>${D.K}</b></span><span>MSE: <b>${D.mse.toFixed(4)}</b> (≤ 0.05)</span>`+
 Object.keys(COL).map(f=>`<span><i class="dot" style="background:#${COL[f].toString(16)}"></i>${f.toUpperCase()}: ${D.ships.filter(s=>s.f==f).length}</span>`).join("");
$("mo").textContent=D.morse;
function tl(){const c=$("tl"),g=c.getContext("2d"),W=c.width,H=c.height,n=D.tgt.length,fg=getComputedStyle(document.body).color;g.clearRect(0,0,W,H);
 g.fillStyle="rgba(150,160,180,.35)";for(let i=0;i<n;i++)if(D.tgt[i])g.fillRect(i/n*W,H*.12,Math.ceil(W/n)+1,H*.38);
 g.fillStyle="#22c55e";for(let i=0;i<n;i++)if(D.rec[i]>.5)g.fillRect(i/n*W,H*.55,Math.ceil(W/n)+1,H*.38);
 g.fillStyle=fg;g.font=`${11*devicePixelRatio}px system-ui`;g.fillText("Objektivi (gri)",6,H*.1);g.fillText("Sinjali i rindërtuar (jeshile)",6,H*.99);
 g.fillStyle="#ef4444";g.fillRect(t/D.T*W-1,0,2*devicePixelRatio,H)}
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const d=(now-last)/1000;last=now;if(play){t=mod(t+d*sp*1.6,D.T);$("sl").value=t/D.T*1000}
 let n=0;for(const o of sh){const s=o.s,[c,P]=s.tr[0],u=mod((t-c)/P,1)*o.pts.length,i=Math.floor(u),a=o.pts[i],b=o.pts[(i+1)%o.pts.length];o.m.position.lerpVectors(a,b,u-i);
  let on=false;for(const [cc,pp] of s.tr)if(Math.abs(mod(t-cc+pp/2,pp)-pp/2)<D.w/2)on=true;
  o.m.material.color.set(on?0xff3b30:0xffffff);o.m.scale.setScalar(on?2.4:1);if(on)n++}
 moon.material.color.setScalar(n?.15:.81);cam();R.render(S,C);tl()})(last);
</script></body></html>
